videos:
  - title: Introducing the Datahub
    text: This video tutorial introduces the viewer to the Colonial Collections Datahub of the Colonial Collections Consortium. It highlights what a user can find on the platform and explains key features that can be used.
    vimeoId: "1146519930"
  - title: Searching objects and belongings
    text: In this video tutorial, we look at how to search for objects using the Search Objects feature in the Research Application of the Datahub. This feature helps the user to answer the questions of what cultural heritage objects from a colonial context are currently present in the Netherlands? And how did they get here?
    vimeoId: "1146568055"
    active: true
  - title: Creating and joining communities
    text: 'The Colonial Collections Datahub can not only be used to search for objects, but also to find peers to share information and knowledge with. Users can, for example, find other researchers with the same cultural background or the same research subject through the Datahub’s communities. You can make a new community or become a member of an already existing community.'
    vimeoId: "1146571219"
    active: true
  - title: Adding narratives
    text: 'A large part of the information about objects in Dutch museum collections that were collected in the colonial period is written and registered from a Eurocentric perspective. This includes the information visible in the Datahub. This is why it is important for collections from colonial contexts that perspectives of communities of origin are added to the objects’ metadata. In this video, you will learn how to add perspectives and missing narratives to the objects, using the Datahub.'
    vimeoId: "1146583635"
    active: true
  - title: Local context notices
    text: 'In this video tutorial, you will learn how to add Local Contexts Notices to belongings in the Datahub. These Context Notices are an important addition to belongings from colonial contexts, because they offer space for cultural sensitivities and values of communities of origin. With these notices, perspectives from communities of origin are added to Eurocentric perspectives that were used to describe and register these belongings in museum collections.'
    vimeoId: "1146593863"
    active: true
  - title: Research Aids
    text: 'The NIOD Institute for War, Holocaust and Genocide studies, one of the partens of the Consortium, has created digital research aids for the Datahub. In this last video tutorial you will learn more about how to use them. The digital research aids are one of the three elements of the Datahub and were created to assist in doing provenance research on colonial collections. Some of the research aids include more general information about doing this type of research, while others focus on collectors, institutions or locations.'
    vimeoId: "1146609367"
    active: true
