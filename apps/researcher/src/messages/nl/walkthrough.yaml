videos:
  - title: Introductie van de Datahub
    text: Deze videotutorial introduceert de kijker aan de Koloniale Collecties Datahub van het Consortium Koloniale Collecties. Het laat zien wat een gebruiker op het platform kan vinden en licht de belangrijkste functionaliteiten toe.
    vimeoId: '1146519930'
  - title: Objecten zoeken
    text: 'In deze videotutorial bekijken we hoe je objecten kunt zoeken met de optie ‘Objecten zoeken’ in de Onderzoeksapplicatie van de Datahub. Deze functionaliteit helpt gebruikers om antwoord te vinden op vragen als: welke cultureel erfgoed uit een koloniale context bevindt zich momenteel in Nederland? En hoe is dit hier terechtgekomen?'
    vimeoId: '1146568055'
    active: true
  - title: Communities aanmaken en lid worden
    text: 'De Koloniale Collecties Datahub is niet alleen voor het zoeken van objecten, maar juist ook om gelijkgestemden te vinden en informatie en kennis met elkaar te delen. Gebruikers kunnen bijvoorbeeld andere onderzoekers vinden met dezelfde culturele achtergrond of hetzelfde onderzoeksonderwerp. Je kunt zelf een community aanmaken of lid worden van bestaande communities.'
    vimeoId: '1146571219'
    active: true
  - title: Verhalen toevoegen
    text: 'Veel van de informatie over objecten in Nederlandse museumcollecties die in de koloniale periode zijn verzameld, is geschreven en geregistreerd vanuit een eurocentrisch perspectief. Dit geldt ook voor de informatie die in de Datahub te zien is. Daarom is het voor collecties uit koloniale contexten van groot belang dat de perspectieven van gemeenschappen van herkomst worden toegevoegd aan de metadata van de objecten. In deze video leer je hoe je met behulp van de Datahub perspectieven en ontbrekende verhalen aan de objecten kunt toevoegen.'
    vimeoId: '1146583635'
    active: true
  - title: Local Contexts Notices
    text: 'In deze video tutorial leer je hoe je Local Contexts Notices kunt toevoegen aan de objecten in de Datahub. Deze annotaties zijn een belangrijke toevoeging aan de objecten uit koloniale context, omdat ze ruimte voor culturele gevoeligheden en waarden van herkomstgemeenschappen bieden. Hiermee kunnen Eurocentrische perspectieven aangevuld of gecorrigeerd worden met perspectieven uit de gemeenschappen zelf.'
    vimeoId: '1146593863'
    active: true
  - title: Zoekhulpen
    text: 'Het NIOD Instituut voor Oorlogs-, Holocaust- en Genocidestudies, één van de Consortiumpartners, heeft digitale zoekhulpen ontwikkeld voor de Datahub en in deze laatste video tutorial leer je hoe je die kunt gebruiken. De digitale zoekhulpen zijn een van de drie onderdelen van de Datahub en zijn ontwikkeld om onderzoekers die herkomstonderzoek doen te ondersteunen. Er zijn zoekhulpen met algemene informatie en zoekhulpen over verschillende categorieën, thema’s, en locaties.'
    vimeoId: '1146609367'
    active: true
